[project]
name = "shop-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Anna Makarova",email = "foxygoldy84@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "poethepoet (>=0.46.0,<0.47.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.poe.tasks.fix]
sequence = [
    { cmd = "isort ." },
    { cmd = "black ." },
    { cmd = "flake8 ." },
    { cmd = "mypy ." },
    { cmd = "pytest" }
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"



[tool.black]
line-length = 120
target-version = ['py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true


[tool.flake8]
max-line-length = 120
extend-ignore = "E203"
exclude = ".git,__pycache__,docs,old,build,dist,.venv"
